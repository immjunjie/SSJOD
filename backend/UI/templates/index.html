<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Printer Logger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>3D Printer Logger</h1>
        {% if logging %}
            <p>Status: <span class="active">Logging Active</span></p>
            <a href="{{ url_for('stop') }}" class="button stop">Stop Logging</a>
        {% else %}
            <p>Status: <span class="inactive">Logging Stopped</span></p>
            <a href="{{ url_for('start') }}" class="button start">Start Logging</a>
        {% endif %}
    </div>
</body>
</html>
