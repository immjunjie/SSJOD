<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Printer Logger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>3D Printer Logger</h1>

        {% if logging %}
            <p>Status: <span class="active">Logging Active</span></p>
            <a href="{{ url_for('stop') }}" class="button stop">Stop Logging</a>
        {% else %}
            <p>Status: <span class="inactive">Logging Stopped</span></p>
            <form action="{{ url_for('start') }}" method="post">
                <h3>Select endpoints to monitor:</h3>
                {% for endpoint in listOfEndpoints %}
                    <div style="text-align:left;">
                        <input type="checkbox" id="cb{{ loop.index0 }}" name="ep{{ loop.index0 }}"
                            {% if sequence[loop.index0] == '1' %}checked{% endif %}>
                        <label for="cb{{ loop.index0 }}">{{ endpoint }}</label>
                    </div>
                {% endfor %}
                <button type="submit" class="button start">Start Logging</button>
            </form>
        {% endif %}
    </div>


    <div class="log-section">
        <h3>Live Logs</h3>
        <div id="log-output">
        </div>
        <button class="button clear" onclick="clearLogs()">Clear Logs</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let logs = JSON.parse(localStorage.getItem("printerLogs") || "[]");

        const logDiv = document.getElementById("log-output");

        // On page load, restore old logs
        logs.forEach(entry => {
            const p = document.createElement("p");
            p.innerText = entry;
            logDiv.appendChild(p);
        });

        socket.on('new_log', function(data) {
            const logEntry = `[${data.timestamp}] Layer ${data.layer} | Z: ${data.position_z} | Scan: ${data.scan}`;
            logs.push(logEntry);
            if (logs.length > 500) logs.shift(); // limit memory

            localStorage.setItem("printerLogs", JSON.stringify(logs));

            const p = document.createElement("p");
            p.innerText = logEntry;
            logDiv.appendChild(p);

            logDiv.scrollTop = logDiv.scrollHeight; // auto-scroll
        });

        function clearLogs() {
            logs = [];
            localStorage.removeItem("printerLogs");
            logDiv.innerHTML = "";  // clear the displayed logs
}
    </script>
</body>
</html>
